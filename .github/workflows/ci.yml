name: CI

on:
  # No merge_group — Merge Queue off by default (Fast Trunk).
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: sylphx-linux-standard

    steps:
      - uses: actions/checkout@v4

      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Source verification only — no disposable release packaging in ordinary CI.
      # cargo test compiles the retrieval core under the test profile.
      - name: Rust core tests
        run: cargo test

      - name: Golden retrieval evals
        run: bun test test/golden-retrieval.test.ts

      - name: Retrieval parity (frozen baseline)
        run: bun test test/retrieval-parity.test.ts

      - name: Type check
        run: bun run type-check

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Public benchmark proof
        run: bun run benchmark:public-proof

      - name: Release gate
        run: bun run benchmark:release-gate

      - name: Docs build
        run: bun run docs:build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./packages/core/coverage/lcov.info
          fail_ci_if_error: false
