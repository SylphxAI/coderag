name: Publish brand alias

# RETIRED (brand-sole hard cut): @sylphx/locus is the sole public MCP package id.
# Dual-publish from @sylphx/coderag-mcp is no longer valid. Use "Publish MCP npm"
# or "Publish Locus MCP multi-arch" which publish @sylphx/locus directly.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RETIRED (workflow intentionally fails closed)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: sylphx-linux-standard
    steps:
      - name: Brand-sole — dual alias path retired
        run: |
          set -euo pipefail
          echo "::error::publish-brand-alias is retired. Canonical package is @sylphx/locus."
          echo "Use workflow 'Publish MCP npm' or 'Publish Locus MCP multi-arch' with confirm=PUBLISH."
          echo "Transitional @sylphx/coderag-mcp is not a publish source."
          exit 1

