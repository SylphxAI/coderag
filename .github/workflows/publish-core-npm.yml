name: Publish core npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Build and publish @sylphx/coderag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          npm whoami
          bun install --frozen-lockfile || bun install
          bun run --filter @sylphx/coderag build
          cd packages/core
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo already "$NAME@$VER"
            npm view "$NAME" version dist-tags
            exit 0
          fi
          npm publish --access public 2>&1 | tee /tmp/core-pub.log
          for i in $(seq 1 24); do
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              npm view "$NAME" version dist-tags
              exit 0
            fi
            sleep 5
          done
          if grep -q "+ $NAME@$VER" /tmp/core-pub.log; then
            echo "publish log success; delayed readback acceptable"
            exit 0
          fi
          exit 1
