name: Publish Locus MCP multi-arch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-darwin:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            key: darwin-arm64
          - target: x86_64-apple-darwin
            key: darwin-x64
    runs-on: [self-hosted, sylphx, macos, standard]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          set -euo pipefail
          cargo build --release -p coderag-mcp-server -p coderag-cli --target ${{ matrix.target }}
          mkdir -p native-out
          cp target/${{ matrix.target }}/release/locus-mcp-server native-out/
          cp target/${{ matrix.target }}/release/locus-cli native-out/
          chmod +x native-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.key }}
          path: native-out/

  build-linux-x64:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: |
          set -euo pipefail
          cargo build --release -p coderag-mcp-server -p coderag-cli --target x86_64-unknown-linux-gnu
          mkdir -p native-out
          cp target/x86_64-unknown-linux-gnu/release/locus-mcp-server native-out/
          cp target/x86_64-unknown-linux-gnu/release/locus-cli native-out/
          chmod +x native-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64-gnu
          path: native-out/

  build-linux-arm64:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build linux-arm64 via zig cross
        run: |
          set -euo pipefail
          cargo install cargo-zigbuild --version 0.23.0 --locked
          cargo zigbuild --release -p coderag-mcp-server -p coderag-cli --target aarch64-unknown-linux-gnu.2.17
          mkdir -p native-out
          cp target/aarch64-unknown-linux-gnu/release/locus-mcp-server native-out/
          cp target/aarch64-unknown-linux-gnu/release/locus-cli native-out/
          chmod +x native-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64-gnu
          path: native-out/

  publish:
    needs: [build-darwin, build-linux-x64, build-linux-arm64]
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          always-auth: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage platforms, publish natives + @sylphx/locus
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          unset npm_config_workspace || true
          unset npm_config_workspaces || true
          npm whoami
          VER=$(node -p "require('./packages/mcp-server/package.json').version")
          echo "MCP version $VER"
          ls -laR artifacts
          publish_one() {
            local name="$1" ver="$2" dest="$3" key="$4"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo already "$name@$ver"
              return 0
            fi
            local log="/tmp/npm-pub-$key.log"
            (cd "$dest" && npm publish --access public) 2>&1 | tee "$log"
            # Prefer registry package document over CLI view (CDN lag on new names)
            local ok=0
            for i in $(seq 1 60); do
              if npm view "$name@$ver" version >/dev/null 2>&1; then ok=1; break; fi
              enc=$(node -p "encodeURIComponent(process.argv[1])" "$name")
              code=$(curl -sS -o /tmp/reg-pkg.json -w '%{http_code}' "https://registry.npmjs.org/$enc/$ver" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "readback ok $name@$ver"
              return 0
            fi
            if grep -qE "\+ $name@$ver" "$log"; then
              echo "WARN: publish success for $name@$ver but registry view lagged; continuing"
              return 0
            fi
            echo "FATAL: failed publish/readback $name@$ver" >&2
            cat "$log" >&2 || true
            return 1
          }
          for key in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            srcdir=$(find artifacts -type d -name "native-$key" | head -1)
            test -n "$srcdir"
            dest=packages/mcp-server/npm/$key
            mkdir -p "$dest"
            cp "$srcdir/locus-mcp-server" "$dest/"
            cp "$srcdir/locus-cli" "$dest/"
            chmod +x "$dest"/*
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));p.version=process.argv[2];fs.writeFileSync(process.argv[1],JSON.stringify(p,null,2)+'\n')" "$dest/package.json" "$VER"
            name=$(node -p "require('./'+process.argv[1]+'/package.json').name" "$dest")
            publish_one "$name" "$VER" "$dest" "$key"
          done
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('packages/mcp-server/package.json','utf8'));p.dependencies={'@sylphx/coderag':'workspace:*'};fs.writeFileSync('packages/mcp-server/package.json',JSON.stringify(p,null,2));"
          bun install --frozen-lockfile || bun install
          bun run --filter @sylphx/coderag build
          bun run --filter @sylphx/locus build
          STAGE=$(mktemp -d)
          cp -a packages/mcp-server/. "$STAGE/"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const coreVer=JSON.parse(fs.readFileSync('packages/core/package.json','utf8')).version;p.dependencies={'@sylphx/coderag':coreVer};p.private=false;p.publishConfig={access:'public'};delete p.scripts;if(p.bin&&typeof p.bin==='object'){const primary=p.bin.locus||Object.values(p.bin)[0];p.bin={locus:primary};}fs.writeFileSync(process.argv[1],JSON.stringify(p,null,2));" "$STAGE/package.json"
          cd "$STAGE"
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo already "$NAME@$VER"
          else
            npm publish --access public
            for i in $(seq 1 24); do npm view "$NAME@$VER" version >/dev/null 2>&1 && break; sleep 5; done
          fi
          # Package is brand-sole @sylphx/locus; dual-publish alias path retired.
          test "$NAME" = '@sylphx/locus'
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            npm view "$NAME@$VER" version bin dependencies optionalDependencies || true
          else
            echo "WARN: main package registry view lag for $NAME@$VER"
          fi
