name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  # Every native build selects one literal owned profile. Linux arm64 is
  # cross-compiled with Zig on the standard owned Linux profile.
  build-darwin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    name: Native ${{ matrix.target }}
    runs-on: [self-hosted, sylphx, macos, standard]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-native-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-native-${{ matrix.target }}-

      - name: Build release natives
        run: |
          set -euo pipefail
          cargo build --release -p coderag-mcp-server -p coderag-cli --target ${{ matrix.target }}
          mkdir -p native-out
          for name in coderag-mcp-server coderag-cli; do
            bin="target/${{ matrix.target }}/release/${name}"
            test -f "$bin"
            chmod +x "$bin"
            file "$bin" || true
            test "$(wc -c < "$bin")" -gt 100000
            cp "$bin" "native-out/${name}"
            chmod +x "native-out/${name}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderag-native-${{ matrix.target }}
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  build-linux-x64:
    name: Native x86_64-unknown-linux-gnu
    runs-on: sylphx-linux-standard

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-native-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-native-x86_64-unknown-linux-gnu-

      - name: Build release natives
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          cargo build --release -p coderag-mcp-server -p coderag-cli --target "$target"
          mkdir -p native-out
          for name in coderag-mcp-server coderag-cli; do
            bin="target/${target}/release/${name}"
            test -f "$bin"
            chmod +x "$bin"
            file "$bin" || true
            test "$(wc -c < "$bin")" -gt 100000
            cp "$bin" "native-out/${name}"
            chmod +x "native-out/${name}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderag-native-x86_64-unknown-linux-gnu
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  build-linux-arm64:
    name: Native aarch64-unknown-linux-gnu
    runs-on: sylphx-linux-standard

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-native-aarch64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-native-aarch64-unknown-linux-gnu-

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Cross-compile release natives
        run: |
          set -euo pipefail
          target=aarch64-unknown-linux-gnu
          # The package promise is glibc >= 2.17, the oldest arm64 glibc ABI.
          cargo zigbuild --release -p coderag-mcp-server -p coderag-cli --target "${target}.2.17"
          mkdir -p native-out
          for name in coderag-mcp-server coderag-cli; do
            bin="target/${target}/release/${name}"
            test -f "$bin"
            chmod +x "$bin"
            bash scripts/verify-linux-arm64-artifact.sh "$bin"
            cp "$bin" "native-out/${name}"
            chmod +x "native-out/${name}"
          done

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderag-native-aarch64-unknown-linux-gnu
          path: native-out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-darwin, build-linux-x64, build-linux-arm64]
    uses: SylphxAI/.github/.github/workflows/release.yml@main
    with:
      # When artifact is set, reusable workflow skips the default build step and
      # downloads coderag-native-* into artifacts/. prepublish rebuilds TS,
      # assembles platform packages (fail-closed all arches), and prepares bins.
      artifact: 'coderag-native-*'
      prepublish: |
        set -euo pipefail
        if ! command -v rustc >/dev/null 2>&1; then
          if [ -f "$HOME/.cargo/env" ]; then
            # shellcheck source=/dev/null
            . "$HOME/.cargo/env"
          fi
        fi
        if ! command -v rustc >/dev/null 2>&1; then
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          # shellcheck source=/dev/null
          . "$HOME/.cargo/env"
        fi
        export PATH="${HOME}/.cargo/bin:${PATH}"

        echo "== multi-arch artifacts =="
        ls -laR artifacts || true

        bun run build
        bun scripts/assemble-multiarch-natives.ts

        # Keep host-path staging for local-style layout inside the published
        # package (optional); primary consumer path is optionalDependencies.
        # Stage linux x64 into bin/native as a documented linux fallback when
        # the optional dep package is present alongside. Both natives required
        # so tools/call can resolve sibling coderag-cli without monorepo build.
        mkdir -p packages/mcp-server/bin/native bin/native
        for name in coderag-mcp-server coderag-cli; do
          if [ -f "packages/mcp-server/npm/linux-x64-gnu/${name}" ]; then
            cp "packages/mcp-server/npm/linux-x64-gnu/${name}" "packages/mcp-server/bin/native/${name}"
            cp "packages/mcp-server/npm/linux-x64-gnu/${name}" "bin/native/${name}"
            chmod +x "packages/mcp-server/bin/native/${name}" "bin/native/${name}"
          fi
        done

        chmod +x packages/mcp-server/bin/coderag-mcp bin/coderag-mcp
        test -x packages/mcp-server/bin/coderag-mcp
        head -n 8 packages/mcp-server/bin/coderag-mcp

        # Fail-closed: every platform package must contain both natives
        for dir in packages/mcp-server/npm/*/; do
          test -f "${dir}package.json"
          for name in coderag-mcp-server coderag-cli; do
            test -x "${dir}${name}"
            test "$(wc -c < "${dir}${name}")" -gt 100000
            echo "OK $(basename "$dir") ${name} $(wc -c < "${dir}${name}") bytes"
            file "${dir}${name}" || true
          done
        done

        # Sync platform package versions to mcp-server (covers version-PR path
        # when fixed group already aligned them).
        bun scripts/sync-platform-versions.ts
      postpublish: |
        set -euo pipefail
        bun scripts/verify-multiarch-readback.ts
    secrets: inherit
