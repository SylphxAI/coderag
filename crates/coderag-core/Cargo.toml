[package]
name = "coderag-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BM25 retrieval core for Locus. The route id rust-tfidf is historical."

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
walkdir = "2.5"